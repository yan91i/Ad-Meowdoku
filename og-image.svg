<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Play Meowdoku Online</title>
  <desc id="desc">Meowdoku online preview with the cat mascot, colored puzzle regions, and browser play message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4d9"/>
      <stop offset="0.52" stop-color="#effff5"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#5b5ed6"/>
      <stop offset="1" stop-color="#3f3f9c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#253045" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.32" stroke="#253045" stroke-width="1">
    <path d="M0 92h1200M0 184h1200M0 276h1200M0 368h1200M0 460h1200M0 552h1200"/>
    <path d="M92 0v630M184 0v630M276 0v630M368 0v630M460 0v630M552 0v630M644 0v630M736 0v630M828 0v630M920 0v630M1012 0v630M1104 0v630"/>
  </g>
  <rect x="60" y="58" width="1080" height="514" rx="34" fill="#fffefb" opacity="0.92" filter="url(#shadow)"/>
  <g transform="translate(100 98)">
    <image href="/game/assets/cat-face.png" x="0" y="0" width="86" height="86"/>
    <text x="108" y="36" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#5b5ed6">MEOWDOKU ONLINE</text>
    <text x="0" y="166" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#253045">Play Meowdoku</text>
    <text x="2" y="226" font-family="Arial, sans-serif" font-size="30" fill="#6c6374">Place one cat per region. No download.</text>
    <rect x="0" y="272" width="236" height="62" rx="12" fill="url(#button)"/>
    <text x="38" y="313" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Play in browser</text>
  </g>
  <g transform="translate(104 430)" stroke="#ffffff" stroke-width="5">
    <rect width="62" height="62" rx="12" fill="#86dfb6"/>
    <rect x="68" width="62" height="62" rx="12" fill="#ffe07a"/>
    <rect x="136" width="62" height="62" rx="12" fill="#ff9aa2"/>
    <rect x="204" width="62" height="62" rx="12" fill="#8bd2ff"/>
    <rect x="272" width="62" height="62" rx="12" fill="#86dfb6"/>
    <text x="154" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#253045">cat</text>
    <text x="222" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#7b2f58">X</text>
  </g>
  <g transform="translate(715 72)">
    <rect x="0" y="58" width="330" height="330" rx="30" fill="#fff4c9" stroke="#eadbd0" stroke-width="4"/>
    <g transform="translate(36 94)" stroke="#ffffff" stroke-width="5">
      <rect width="78" height="78" rx="14" fill="#ff9aa2"/>
      <rect x="86" width="78" height="78" rx="14" fill="#8bd2ff"/>
      <rect x="172" width="78" height="78" rx="14" fill="#86dfb6"/>
      <rect y="86" width="78" height="78" rx="14" fill="#86dfb6"/>
      <rect x="86" y="86" width="78" height="78" rx="14" fill="#ffe07a"/>
      <rect x="172" y="86" width="78" height="78" rx="14" fill="#ff9aa2"/>
      <rect y="172" width="78" height="78" rx="14" fill="#8bd2ff"/>
      <rect x="86" y="172" width="78" height="78" rx="14" fill="#ff9aa2"/>
      <rect x="172" y="172" width="78" height="78" rx="14" fill="#ffe07a"/>
    </g>
    <image href="/game/assets/victory-cat.png" x="122" y="0" width="255" height="314"/>
  </g>
</svg>
